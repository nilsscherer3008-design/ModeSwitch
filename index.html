<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ModeSwitch</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #EAF3EE;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  #root {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 32px 16px;
    min-height: 100vh;
  }
  .card { position: relative; max-width: 420px; width: 100%; background: #F5FBF8; border-radius: 24px; overflow: hidden; border: 1px solid #DCEEE6; display: flex; flex-direction: column; min-height: 700px; }
  button { font-family: inherit; }
  input, select { font-family: inherit; }
  .btn-primary { width: 100%; background: #6FBE9C; color: #fff; border: none; border-radius: 10px; padding: 11px 0; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-secondary { width: 100%; background: #fff; color: #8FAFA0; border: 1px solid #DCEEE6; border-radius: 10px; padding: 11px 0; font-size: 13px; font-weight: 600; cursor: pointer; }
  .icon-btn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid #DCEEE6; background: #fff; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .field { width: 100%; box-sizing: border-box; border: 1px solid #DCEEE6; border-radius: 10px; padding: 9px 10px; font-size: 13px; outline: none; }
</style>
</head>
<body>
<div id="root"></div>

<script>
(function () {
  "use strict";

  /* ---------- constants & helpers ---------- */

  var TRIAL_DAYS = 21;

  var SIZE_INFO = {
    klein: { label: "Klein (~5 Min)", points: 100 },
    mittel: { label: "Mittel (15-30 Min)", points: 150 },
    gross: { label: "Groß (45+ Min)", points: 300 },
    meilenstein: { label: "Meilenstein", points: 400 },
  };
  var CATEGORIES = ["Sport", "Lernen", "Sonstiges"];
  var WEEKDAY_LABELS = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
  var AD_PARTNERS = [
    { name: "ESN Proteinpulver", tag: "20% mit Code MODESWITCH" },
    { name: "Fitnessloft", tag: "Erste Woche gratis" },
    { name: "Ahead", tag: "Fokus-Bänder für Sportler" },
    { name: "Faire Natural", tag: "Nachhaltige Sportbekleidung" },
    { name: "Nike", tag: "Neue Laufschuh-Kollektion" },
    { name: "Teveo", tag: "Smarte Trinkflasche" },
  ];
  var MOCK_USERS = [
    { id: "saphie_98", name: "Saphie", level: 12, streak: 8 },
    { id: "sophis_r", name: "Sophis", level: 9, streak: 3 },
    { id: "lena.k", name: "Lena Klein", level: 15, streak: 21 },
    { id: "max_fit", name: "Max Fischer", level: 6, streak: 0 },
    { id: "nora99", name: "Nora Weber", level: 20, streak: 45 },
    { id: "tim_run", name: "Tim Runner", level: 3, streak: 2 },
    { id: "julia_j", name: "Julia Jung", level: 11, streak: 14 },
  ];

  var GREEN = "#6FBE9C";
  var GREEN_DARK = "#3E7A62";
  var GREEN_LIGHT = "#E6F5EE";
  var CARD_BORDER = "#DCEEE6";
  var TEXT_DARK = "#1F2A24";
  var TEXT_MUTED = "#8FAFA0";

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function dateKey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function startOfWeek(d) {
    var date = new Date(d);
    var day = (date.getDay() + 6) % 7;
    date.setDate(date.getDate() - day);
    date.setHours(0, 0, 0, 0);
    return date;
  }
  function addDays(d, n) { var date = new Date(d); date.setDate(date.getDate() + n); return date; }
  function uid() { return Math.random().toString(36).slice(2, 10); }
  function esc(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function daysSince(dayKey) {
    var start = new Date(dayKey + "T00:00:00");
    var now = new Date();
    now.setHours(0, 0, 0, 0);
    return Math.floor((now - start) / 86400000);
  }
  function subscriptionState(sub) {
    if (!sub) return { status: "trial", daysLeft: TRIAL_DAYS };
    if (sub.status === "premium") return { status: "premium", daysLeft: 0 };
    var elapsed = daysSince(sub.trialStart);
    var daysLeft = TRIAL_DAYS - elapsed;
    if (daysLeft > 0) return { status: "trial", daysLeft: daysLeft };
    return { status: "free", daysLeft: 0 };
  }
  function levelFromPoints(points) {
    var level = Math.floor(points / 1000) + 1;
    var into = points % 1000;
    return { level: level, toNext: 1000 - into, progress: into / 1000 };
  }

  var today = new Date();
  var todayKey = dateKey(today);

  function defaultData() {
    return {
      totalPoints: 0,
      streak: 0,
      lastCompletionDate: null,
      tasksByDate: {},
      posts: [],
      friends: [],
      subscription: { status: "trial", trialStart: todayKey },
    };
  }

  function dataKeyFor(username) { return "modeswitch:data:" + username; }
  var USERS_KEY = "modeswitch:users";
  var SESSION_KEY = "modeswitch:session";

  function loadUsers() {
    try {
      var raw = localStorage.getItem(USERS_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return {};
  }
  function saveUsers(users) {
    try { localStorage.setItem(USERS_KEY, JSON.stringify(users)); } catch (e) { console.error("Speichern fehlgeschlagen", e); }
  }
  function getSession() {
    try { return localStorage.getItem(SESSION_KEY) || null; } catch (e) { return null; }
  }
  function setSession(username) {
    try { localStorage.setItem(SESSION_KEY, username); } catch (e) {}
  }
  function clearSession() {
    try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
  }

  var FEED_KEY = "modeswitch:feed";
  function loadFeed() {
    try {
      var raw = localStorage.getItem(FEED_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return [];
  }
  function saveFeed() {
    try { localStorage.setItem(FEED_KEY, JSON.stringify(sharedFeed)); } catch (e) { console.error("Speichern fehlgeschlagen", e); }
  }

  function loadData(username) {
    try {
      var raw = localStorage.getItem(dataKeyFor(username));
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.friends)) {
          if (!parsed.subscription) parsed.subscription = { status: "trial", trialStart: todayKey };
          return parsed;
        }
      }
    } catch (e) {}
    return defaultData();
  }
  function saveData() {
    if (!auth.currentUser) return;
    try { localStorage.setItem(dataKeyFor(auth.currentUser), JSON.stringify(state)); } catch (e) { console.error("Speichern fehlgeschlagen", e); }
  }

  /* ---------- icons ---------- */

  var ICON_PATHS = {
    home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',
    calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/>',
    users: '<path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
    bar: '<path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    flame: '<path d="M12 2c1 4-3 5-3 9a3 3 0 0 0 6 0c0-1-.5-2-1-3 2 1 4 3 4 6a6 6 0 0 1-12 0c0-5 3-6 6-12Z"/>',
    heart: '<path d="M12 21s-7-4.35-9.5-8.5C.5 8.5 3 4 7 4c2 0 3.5 1.2 5 3 1.5-1.8 3-3 5-3 4 0 6.5 4.5 4.5 8.5C19 16.65 12 21 12 21Z"/>',
    message: '<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/>',
    share: '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5 15.4 17.5M15.4 6.5 8.6 10.5"/>',
    x: '<path d="M18 6 6 18M6 6l12 12"/>',
    chevronLeft: '<path d="M15 18l-6-6 6-6"/>',
    chevronRight: '<path d="M9 18l6-6-6-6"/>',
    trash: '<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6h16Z"/><path d="M10 11v6M14 11v6"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
    userplus: '<path d="M13 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="8" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/>',
    userminus: '<path d="M13 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="8" cy="7" r="4"/><path d="M22 11h-6"/>',
    coin: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="7.6" stroke-dasharray="1.4 1.6" stroke-width="0.8"/><path d="M13.4 8.2c1.8 0.9 2.9 2.8 2.4 4.8-0.5 2-2.5 3.3-4.6 2.9-1.7-0.3-2.9-1.8-2.7-3.4 0.2-1.3 1.4-2.2 2.6-2 1 0.2 1.7 1.1 1.5 2-0.1 0.7-0.8 1.1-1.4 1"/><path d="M13 6.6l2.4 1.6-2 1.7"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
    logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>',
    image: '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="M21 15l-5-5-4 4-3-3-4 4"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
    bell: '<path d="M6 9a6 6 0 0 1 12 0c0 4 1.5 5.5 2 6H4c0.5-0.5 2-2 2-6Z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
    play: '<path d="M7 5v14l12-7Z"/>',
  };
  function icon(name, opts) {
    opts = opts || {};
    var size = opts.size || 20;
    var color = opts.color || "currentColor";
    var fill = opts.fill || "none";
    var extra = opts.style ? ' style="' + opts.style + '"' : "";
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="' + fill +
      '" stroke="' + color + '" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"' + extra + '>' +
      (ICON_PATHS[name] || "") + "</svg>";
  }

  /* ---------- auth state ---------- */

  var auth = { users: loadUsers(), currentUser: null };
  var authUi = { mode: "login", error: "" };
  var authDraft = { name: "", username: "" };
  window.onAuthInput = function (field, val) { authDraft[field] = val; };

  var sessionUser = getSession();
  if (sessionUser && auth.users[sessionUser]) {
    auth.currentUser = sessionUser;
  }

  /* ---------- app state ---------- */

  var state = auth.currentUser ? loadData(auth.currentUser) : defaultData();
  var sharedFeed = loadFeed();
  var pendingPhotoDataUrl = null;
  var ui = { tab: "home", weekOffset: 0, selectedDate: todayKey, showAddTask: false, showSubscribe: false, friendQuery: "" };

  function persistAndRender() { saveData(); render(); }

  /* ---------- auth actions ---------- */

  window.setAuthMode = function (mode) { authUi.mode = mode; authUi.error = ""; render(); };

  function simpleHash(str) {
    var h = 5381;
    for (var i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0;
    return h.toString(36);
  }

  window.doRegister = function () {
    var nameEl = document.getElementById("authName");
    var userEl = document.getElementById("authUsername");
    var passEl = document.getElementById("authPassword");
    var passConfirmEl = document.getElementById("authPasswordConfirm");
    var name = nameEl.value.trim();
    var username = userEl.value.trim().toLowerCase().replace(/[^a-z0-9_.]/g, "");
    var pass = passEl.value;
    var passConfirm = passConfirmEl.value;
    if (!name || !username || !pass) { authUi.error = "Bitte alle Felder ausfüllen."; render(); return; }
    if (pass.length < 6) { authUi.error = "Passwort muss mindestens 6 Zeichen haben."; render(); return; }
    if (pass !== passConfirm) { authUi.error = "Passwörter stimmen nicht überein."; render(); return; }
    if (auth.users[username]) { authUi.error = "Dieser Nutzername ist schon vergeben."; render(); return; }
    auth.users[username] = { name: name, password: simpleHash(pass) };
    saveUsers(auth.users);
    auth.currentUser = username;
    setSession(username);
    state = defaultData();
    saveData();
    ui.tab = "home";
    authDraft = { name: "", username: "" };
    startBackgroundTimers();
    render();
  };

  window.doLogin = function () {
    var userEl = document.getElementById("authUsername");
    var passEl = document.getElementById("authPassword");
    var username = userEl.value.trim().toLowerCase();
    var pass = passEl.value;
    var user = auth.users[username];
    if (!user) { authUi.error = "Nutzername oder Passwort ist falsch."; render(); return; }
    var hashed = simpleHash(pass);
    var ok = user.password === hashed || user.password === pass;
    if (!ok) { authUi.error = "Nutzername oder Passwort ist falsch."; render(); return; }
    if (user.password === pass) { user.password = hashed; saveUsers(auth.users); }
    auth.currentUser = username;
    setSession(username);
    state = loadData(username);
    ui.tab = "home";
    authDraft = { name: "", username: "" };
    startBackgroundTimers();
    render();
  };

  window.logout = function () {
    clearSession();
    auth.currentUser = null;
    authUi = { mode: "login", error: "" };
    authDraft = { name: "", username: "" };
    stopBackgroundTimers();
    render();
  };

  /* ---------- focus timer ---------- */

  var focusInterval = null;

  window.startFocusTimer = function (minutes) {
    ui.focusTimer = { endsAt: Date.now() + minutes * 60000, minutes: minutes };
    render();
    if (focusInterval) clearInterval(focusInterval);
    focusInterval = setInterval(tickFocusTimer, 1000);
  };

  function tickFocusTimer() {
    if (!ui.focusTimer) { clearInterval(focusInterval); return; }
    var remaining = ui.focusTimer.endsAt - Date.now();
    if (remaining <= 0) {
      clearInterval(focusInterval);
      var bonus = ui.focusTimer.minutes * 4;
      ui.focusTimer = null;
      state.totalPoints += bonus;
      ui.focusTimerJustFinished = bonus;
      persistAndRender();
      return;
    }
    render();
  }

  window.cancelFocusTimer = function () {
    if (focusInterval) clearInterval(focusInterval);
    ui.focusTimer = null;
    render();
  };

  /* ---------- video ads ---------- */

  var adVideoInterval = null;
  var adAutoCheckInterval = null;
  var AD_VIDEO_SECONDS = 6;
  var AD_AUTO_INTERVAL_MS = 60000; // demo cadence; a real app would show these less often

  window.showAdVideo = function () {
    if (ui.adVideo || ui.focusTimer || ui.showSubscribe) return;
    ui.adVideo = { partner: AD_PARTNERS[Math.floor(Math.random() * AD_PARTNERS.length)], secondsLeft: AD_VIDEO_SECONDS };
    render();
    if (adVideoInterval) clearInterval(adVideoInterval);
    adVideoInterval = setInterval(function () {
      if (!ui.adVideo) { clearInterval(adVideoInterval); return; }
      ui.adVideo.secondsLeft -= 1;
      if (ui.adVideo.secondsLeft <= 0) { clearInterval(adVideoInterval); }
      render();
    }, 1000);
  };
  window.closeAdVideo = function () {
    if (adVideoInterval) clearInterval(adVideoInterval);
    ui.adVideo = null;
    render();
  };

  function startAdAutoCheck() {
    if (adAutoCheckInterval) clearInterval(adAutoCheckInterval);
    adAutoCheckInterval = setInterval(function () {
      if (auth.currentUser && subscriptionState(state.subscription).status === "free") {
        window.showAdVideo();
      }
    }, AD_AUTO_INTERVAL_MS);
  }

  function startBackgroundTimers() {
    startAdAutoCheck();
    try {
      if (localStorage.getItem("modeswitch:reminders") === "on" && "Notification" in window && Notification.permission === "granted") {
        if (reminderInterval) clearInterval(reminderInterval);
        reminderInterval = setInterval(sendReminderIfNeeded, REMINDER_INTERVAL_MS);
      }
    } catch (e) {}
  }

  function stopBackgroundTimers() {
    if (adAutoCheckInterval) clearInterval(adAutoCheckInterval);
    if (reminderInterval) clearInterval(reminderInterval);
    if (adVideoInterval) clearInterval(adVideoInterval);
  }

  /* ---------- task reminders (browser notifications) ---------- */

  var reminderInterval = null;
  var REMINDER_INTERVAL_MS = 5 * 60000; // check every 5 minutes while the tab is open

  function countOpenTasksToday() {
    var tasks = (state.tasksByDate && state.tasksByDate[todayKey]) || [];
    var open = 0;
    tasks.forEach(function (t) { if (!t.done) open++; });
    return open;
  }

  function sendReminderIfNeeded() {
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    var open = countOpenTasksToday();
    if (open > 0) {
      try {
        new Notification("ModeSwitch erinnert dich", { body: "Dir fehlen noch " + open + " Aufgabe(n) heute. Zeit, loszulegen! 🔥" });
      } catch (e) {}
    }
  }

  window.enableReminders = function () {
    if (!("Notification" in window)) {
      ui.reminderMsg = "Dein Browser unterstützt leider keine Benachrichtigungen.";
      render();
      return;
    }
    Notification.requestPermission().then(function (perm) {
      if (perm === "granted") {
        try { localStorage.setItem("modeswitch:reminders", "on"); } catch (e) {}
        if (reminderInterval) clearInterval(reminderInterval);
        reminderInterval = setInterval(sendReminderIfNeeded, REMINDER_INTERVAL_MS);
        ui.reminderMsg = "Erinnerungen sind aktiviert.";
      } else {
        ui.reminderMsg = "Ohne Erlaubnis kann ich dir keine Erinnerungen schicken.";
      }
      render();
    });
  };

  window.sendTestReminder = function () {
    if (!("Notification" in window) || Notification.permission !== "granted") {
      ui.reminderMsg = "Bitte zuerst Erinnerungen aktivieren.";
      render();
      return;
    }
    var open = countOpenTasksToday();
    try {
      new Notification("ModeSwitch erinnert dich", {
        body: open > 0 ? "Dir fehlen noch " + open + " Aufgabe(n) heute. Zeit, loszulegen! 🔥" : "Alles erledigt für heute – stark! 🎉",
      });
    } catch (e) {}
  };

  /* ---------- actions ---------- */

  window.setTab = function (t) { ui.tab = t; ui.showAddTask = false; ui.focusTimerJustFinished = null; render(); };

  window.toggleTask = function (dayKey, taskId) {
    var tasks = state.tasksByDate[dayKey] || [];
    var task = null;
    for (var i = 0; i < tasks.length; i++) if (tasks[i].id === taskId) task = tasks[i];
    if (!task) return;
    var nowDone = !task.done;
    var delta = nowDone ? SIZE_INFO[task.size].points : -SIZE_INFO[task.size].points;
    task.done = nowDone;

    if (nowDone && dayKey === todayKey) {
      if (state.lastCompletionDate !== todayKey) {
        var yesterday = dateKey(addDays(today, -1));
        state.streak = state.lastCompletionDate === yesterday ? state.streak + 1 : 1;
        state.lastCompletionDate = todayKey;
      }
    }
    state.totalPoints = Math.max(0, state.totalPoints + delta);
    persistAndRender();
  };

  window.deleteTask = function (dayKey, taskId) {
    var tasks = state.tasksByDate[dayKey] || [];
    var idx = -1, task = null;
    for (var i = 0; i < tasks.length; i++) if (tasks[i].id === taskId) { idx = i; task = tasks[i]; }
    if (idx === -1) return;
    if (task.done) state.totalPoints = Math.max(0, state.totalPoints - SIZE_INFO[task.size].points);
    tasks.splice(idx, 1);
    persistAndRender();
  };

  window.openAddTask = function (dateKeyStr) {
    ui.tab = "calendar";
    ui.selectedDate = dateKeyStr || todayKey;
    ui.showAddTask = true;
    render();
  };
  window.closeAddTask = function () { ui.showAddTask = false; render(); };

  window.addTask = function () {
    var titleEl = document.getElementById("newTaskTitle");
    var catEl = document.getElementById("newTaskCategory");
    var sizeEl = document.getElementById("newTaskSize");
    var minEl = document.getElementById("newTaskMinutes");
    var timeEl = document.getElementById("newTaskTime");
    var title = titleEl.value.trim();
    if (!title) { titleEl.focus(); return; }
    var key = ui.selectedDate;
    if (!state.tasksByDate[key]) state.tasksByDate[key] = [];
    state.tasksByDate[key].push({
      id: uid(), title: title, category: catEl.value, size: sizeEl.value,
      minutes: Number(minEl.value) || 0, time: (timeEl.value || "").trim(), done: false,
    });
    ui.showAddTask = false;
    persistAndRender();
  };

  window.selectDate = function (dateKeyStr) { ui.selectedDate = dateKeyStr; render(); };
  window.changeWeek = function (delta) { ui.weekOffset += delta; render(); };

  window.onProfilePhotoSelected = function (input) {
    var file = input.files && input.files[0];
    if (!file || !auth.currentUser) return;
    var reader = new FileReader();
    reader.onload = function (e) {
      auth.users[auth.currentUser].avatar = e.target.result;
      saveUsers(auth.users);
      render();
    };
    reader.readAsDataURL(file);
  };

  window.onPostPhotoSelected = function (input) {
    var file = input.files && input.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (e) {
      pendingPhotoDataUrl = e.target.result;
      var preview = document.getElementById("postPhotoPreview");
      if (preview) {
        preview.innerHTML =
          '<div style="position:relative;display:inline-block;margin-bottom:10px;">' +
            '<img src="' + pendingPhotoDataUrl + '" style="width:80px;height:80px;object-fit:cover;border-radius:10px;border:1px solid ' + CARD_BORDER + ';" />' +
            '<span onclick="clearPostPhoto()" style="position:absolute;top:-6px;right:-6px;background:#fff;border:1px solid ' + CARD_BORDER + ';border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;">' + icon("x", { size: 12 }) + '</span>' +
          '</div>';
      }
    };
    reader.readAsDataURL(file);

  window.addPost = function () {

    var text = el.value.trim();
    if (!text && !pendingPhotoDataUrl) return;
    var displayName = (auth.users[auth.currentUser] && auth.users[auth.currentUser].name) || auth.currentUser;
    sharedFeed.unshift({
      id: uid(), author: displayName, authorUsername: auth.currentUser, text: text,
      photo: pendingPhotoDataUrl, likedBy: [], comments: 0, date: todayKey,
    });
    pendingPhotoDataUrl = null;
    saveFeed();
    render();

    for (var i = 0; i < sharedFeed.length; i++) {
      var p = sharedFeed[i];
      if (p.id === postId) {
        if (!p.likedBy) p.likedBy = [];
        var idx = p.likedBy.indexOf(auth.currentUser);

        '<div onclick="toggleTask(\'' + dayKey + '\',\'' + t.id + '\')" style="width:22px;height:22px;border-radius:50%;border:1.5px solid ' + (t.done ? GREEN : CARD_BORDER) + ';background:' + (t.done ? GREEN : "#fff") + ';display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;">' +

  function simpleBarChart(data, color) {

  function weekDates() {
    var start = addDays(startOfWeek(today), ui.weekOffset * 7);
    var arr = [];
    for (var i = 0; i < 7; i++) arr.push(addDays(start, i));
    return arr;
  }

  function renderCalendar() {
    var dates = weekDates();
    var dayButtons = dates.map(function (d, i) {
      var key = dateKey(d);
      var isSel = key === ui.selectedDate;
      var isToday = key === todayKey;

            return '' +

              '</div>';
          }).join('<div style="height:8px;"></div>')
        : '<div style="font-size:13px;color:' + TEXT_MUTED + ';padding:8px 0;">Niemand gefunden.</div>';
      results = '<div style="margin-bottom:20px;"><div style="font-size:12px;color:' + TEXT_MUTED + ';margin-bottom:8px;">Suchergebnisse</div>' + rows + '</div>';
    }

    var friendRows = state.friends.length
      ? state.friends.map(function (f) {
          return '' +
            '<div style="display:flex;align-items:center;gap:10px;background:#fff;border:1px solid ' + CARD_BORDER + ';border-radius:12px;padding:10px 12px;">' + avatar(f.name, auth.users[f.id] ? userAvatarUrl(f.id) : null) +
              '<div style="flex:1;min-width:0;">' +
                '<div style="font-size:13px;font-weight:500;color:' + TEXT_DARK + ';">' + esc(f.name) + '</div>' +
                '<div style="font-size:11px;color:' + TEXT_MUTED + ';display:flex;align-items:center;gap:4px;">@' + f.id + ' · Lv.' + f.level + ' · ' + icon("flame", { size: 11 }) + ' ' + f.streak + '</div>' +
              '</div>' +
              '<span onclick="removeFriend(\'' + f.id + '\')" style="cursor:pointer;color:' + TEXT_MUTED + ';">' + icon("trash", { size: 15 }) + '</span>' +
            '</div>';
        }).join('<div style="height:8px;"></div>')
      : '<div style="font-size:13px;color:' + TEXT_MUTED + ';padding:12px 0;">Noch keine Freunde. Suche oben nach Namen oder ID.</div>';

    return '' +
      '<div style="display:flex;align-items:center;gap:8px;background:#fff;border:1px solid ' + CARD_BORDER + ';border-radius:12px;padding:8px 12px;margin-bottom:14px;">' +
        icon("search", { size: 16, color: TEXT_MUTED }) +
        '<input id="friendSearchInput" oninput="onFriendSearch(this.value)" value="' + esc(ui.friendQuery) + '" placeholder="Name oder ID suchen..." style="border:none;outline:none;font-size:13px;flex:1;font-family:inherit;" />' +
        (ui.friendQuery ? '<span style="cursor:pointer;color:' + TEXT_MUTED + ';" onclick="onFriendSearch(\'\')">' + icon("x", { size: 15 }) + '</span>' : "") +
      '</div>' +
      results +
      '<div style="font-size:12px;color:' + TEXT_MUTED + ';margin-bottom:8px;">Deine Freunde (' + state.friends.length + ')</div>' +
      '<div style="display:flex;flex-direction:column;gap:0;">' + friendRows + '</div>';
  }

  function renderStats() {
    var dates = weekDates();
    var weeklyPoints = dates.map(function (d, i) {
      var tasks = state.tasksByDate[dateKey(d)] || [];
      var pts = 0;
      tasks.forEach(function (t) { if (t.done) pts += SIZE_INFO[t.size].points; });
      return { day: WEEKDAY_LABELS[i], value: pts };
    });
    var goalsReached = dates.map(function (d, i) {
      var tasks = state.tasksByDate[dateKey(d)] || [];
      var done = 0;
      tasks.forEach(function (t) { if (t.done) done++; });
      return { day: WEEKDAY_LABELS[i], value: done };
    });
    var catMinutes = { Sport: 0, Lernen: 0, Sonstiges: 0 };
    Object.keys(state.tasksByDate).forEach(function (k) {
      state.tasksByDate[k].forEach(function (t) { if (t.done) catMinutes[t.category] = (catMinutes[t.category] || 0) + (t.minutes || 0); });
    });

    var ads = subscriptionState(state.subscription).status === "free" ? adBanner() : "";

    return '' + ads +
      '<div style="font-size:14px;font-weight:500;color:' + TEXT_DARK + ';margin-bottom:10px;">Ziele erreicht</div>' +
      '<div style="background:#fff;border:1px solid ' + CARD_BORDER + ';border-radius:14px;padding:14px 10px;margin-bottom:18px;">' + simpleBarChart(goalsReached, GREEN_DARK) + '</div>' +
      '<div style="font-size:14px;font-weight:500;color:' + TEXT_DARK + ';margin-bottom:10px;display:flex;align-items:center;gap:6px;">' + icon("coin", { size: 14, color: TEXT_DARK }) + ' ModeCoins diese Woche</div>' +
      '<div style="background:#fff;border:1px solid ' + CARD_BORDER + ';border-radius:14px;padding:14px 10px;margin-bottom:18px;">' + simpleBarChart(weeklyPoints, GREEN) + '</div>' +
      '<div style="display:flex;flex-direction:column;gap:8px;background:#fff;border:1px solid ' + CARD_BORDER + ';border-radius:14px;padding:14px;">' +
        statLine("Sport Gesamtzeit", (catMinutes.Sport || 0) + " min", false) +
        statLine("Lernen Gesamtzeit", (catMinutes.Lernen || 0) + " min", false) +
        statLine("Sonstiges Gesamtzeit", (catMinutes.Sonstiges || 0) + " min", false) +
        statLine("ModeCoins gesammelt", state.totalPoints, true) +
      '</div>';
  }

  function statLine(label, value, isLast) {
    return '' +
      '<div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:' + (isLast ? "0" : "8px") + ';border-bottom:' + (isLast ? "none" : "1px solid #EEF5F1") + ';">' +
        '<span style="font-size:13px;color:' + TEXT_MUTED + ';display:flex;align-items:center;gap:6px;">' + (label === "ModeCoins gesammelt" ? icon("coin", { size: 13, color: TEXT_MUTED }) : "") + label + '</span>' +
        '<span style="font-size:14px;font-weight:600;color:' + TEXT_DARK + ';">' + value + '</span>' +
      '</div>';
  }

  function renderSubBanner() {
    var info = subscriptionState(state.subscription);
    if (info.status === "premium") return "";
    var bg = info.status === "trial" ? "#FFF7E6" : "#FDEDEA";
    var msg = info.status === "trial" ? "Noch " + info.daysLeft + " Tage kostenlos testen" : "Gratis-Version mit Werbung aktiv";
    return '' +
      '<div style="background:' + bg + ';border-bottom:1px solid ' + CARD_BORDER + ';padding:9px 18px;display:flex;align-items:center;justify-content:space-between;gap:8px;">' +
        '<span style="font-size:12px;color:#7A5B12;flex:1;">' + msg + '</span>' +
        '<span onclick="openSubscribe()" style="color:' + GREEN_DARK + ';font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;">Premium ansehen</span>' +
      '</div>';
  }

  function renderSubscribeModal() {
    if (!ui.showSubscribe) return "";
    var info = subscriptionState(state.subscription);
    var features = ["Keine Werbung", "Alle Features freigeschaltet", "Unbegrenzte Challenges mit Freunden", "3 Wochen kostenlos testen"];
    var featureRows = features.map(function (f) {
      return '<div style="display:flex;align-items:center;gap:8px;font-size:13px;color:' + TEXT_DARK + ';">' + icon("check", { size: 14, color: GREEN }) + f + '</div>';
    }).join("");
    var actionBtn = info.status === "premium"
      ? '<button class="btn-secondary" onclick="cancelSubscription()">Premium kündigen (Demo)</button>'
      : '<button class="btn-primary" onclick="subscribeNow()">' + (info.status === "trial" ? "Testphase beenden und abonnieren (Demo)" : "Jetzt abonnieren (Demo)") + '</button>';
    var skipLink = info.status === "trial"
      ? '<div onclick="skipTrial()" style="text-align:center;font-size:12px;color:' + TEXT_MUTED + ';text-decoration:underline;cursor:pointer;margin-top:10px;">Testphase überspringen (nur für Präsentation)</div>'
      : "";

    return '' +
      '<div style="background:#fff;border:1px solid ' + CARD_BORDER + ';border-radius:16px;padding:18px;margin-bottom:18px;">' +
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;">' +
          '<div><div style="font-size:15px;font-weight:600;color:' + TEXT_DARK + ';">ModeSwitch Premium</div><div style="font-size:12px;color:' + TEXT_MUTED + ';">4,99 € / Monat</div></div>' +
          '<span style="cursor:pointer;color:' + TEXT_MUTED + ';" onclick="closeSubscribe()">' + icon("x", { size: 16 }) + '</span>' +
        '</div>' +
        '<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:14px;">' + featureRows + '</div>' +
        actionBtn +
        skipLink +
        '<div style="font-size:11px;color:' + TEXT_MUTED + ';margin-top:8px;text-align:center;">Nur eine Demo-Simulation für die Schulpräsentation, es wird nichts echt bezahlt.</div>' +
      '</div>';
  }

  /* ---------- main render ---------- */

  function renderTopHeader() {
    var titles = { home: "ModeSwitch", calendar: "Tagesplan & Kalender", feed: "Community Feed", friends: "Freunde", stats: "Statistiken" };
    var title = titles[ui.tab] || "ModeSwitch";
    var right = "";
    if (ui.tab === "home") {
      right = '<div style="display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;">' + icon("flame", { size: 18 }) + ' Streak: ' + state.streak + '</div>';
    } else if (ui.tab === "feed") {
      right = '<div style="display:flex;align-items:center;gap:10px;opacity:0.85;">' + icon("chevronLeft", { size: 16 }) + icon("chevronRight", { size: 16 }) + '</div>';
    }
    return '' +
      '<div style="background:' + GREEN + ';color:#fff;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;">' +
        '<span style="font-size:18px;font-weight:600;letter-spacing:0.2px;">' + title + '</span>' +
        '<div style="display:flex;align-items:center;gap:14px;">' +
          right +
          '<span onclick="logout()" title="Abmelden" style="cursor:pointer;opacity:0.85;display:flex;">' + icon("logout", { size: 17 }) + '</span>' +
        '</div>' +
      '</div>';
  }

  function renderAuthScreen() {
    var isRegister = authUi.mode === "register";
    var errorHtml = authUi.error
      ? '<div style="background:#FDEDEA;color:#A34A3D;border-radius:8px;padding:8px 10px;font-size:12px;margin-bottom:10px;">' + esc(authUi.error) + '</div>'
      : "";
    var nameField = isRegister
      ? '<input id="authName" class="field" placeholder="Dein Name" value="' + esc(authDraft.name) + '" oninput="onAuthInput(\'name\', this.value)" style="margin-bottom:8px;" />'
      : "";
    var confirmField = isRegister
      ? '<input id="authPasswordConfirm" type="password" class="field" placeholder="Passwort bestätigen" style="margin-bottom:14px;" />'
      : "";
    return '' +
      '<div class="card" style="align-items:center;justify-content:center;padding:40px 28px;min-height:520px;">' +
        '<div style="width:64px;height:64px;border-radius:50%;background:' + GREEN + ';display:flex;align-items:center;justify-content:center;margin-bottom:14px;">' + icon("flame", { size: 30, color: "#fff" }) + '</div>' +
        '<div style="font-size:20px;font-weight:600;color:' + TEXT_DARK + ';margin-bottom:2px;">ModeSwitch</div>' +
        '<div style="font-size:13px;color:' + TEXT_MUTED + ';margin-bottom:20px;">Change your mode. Change your mind.</div>' +
        '<div style="display:flex;width:100%;background:' + GREEN_LIGHT + ';border-radius:10px;padding:3px;margin-bottom:16px;">' +
          '<button onclick="setAuthMode(\'login\')" style="flex:1;border:none;background:' + (!isRegister ? "#fff" : "transparent") + ';color:' + (!isRegister ? GREEN_DARK : TEXT_MUTED) + ';border-radius:8px;padding:8px 0;font-size:13px;font-weight:600;cursor:pointer;">Anmelden</button>' +
          '<button onclick="setAuthMode(\'register\')" style="flex:1;border:none;background:' + (isRegister ? "#fff" : "transparent") + ';color:' + (isRegister ? GREEN_DARK : TEXT_MUTED) + ';border-radius:8px;padding:8px 0;font-size:13px;font-weight:600;cursor:pointer;">Registrieren</button>' +
        '</div>' +
        errorHtml +
        nameField +
        '<input id="authUsername" class="field" placeholder="Nutzername" value="' + esc(authDraft.username) + '" oninput="onAuthInput(\'username\', this.value)" style="margin-bottom:8px;" />' +
        '<input id="authPassword" type="password" class="field" placeholder="Passwort" style="margin-bottom:' + (isRegister ? "8px" : "14px") + ';" />' +
        confirmField +
        '<button class="btn-primary" onclick="' + (isRegister ? "doRegister()" : "doLogin()") + '">' + (isRegister ? "Konto erstellen" : "Anmelden") + '</button>' +
        '<div style="font-size:11px;color:' + TEXT_MUTED + ';margin-top:12px;text-align:center;">Lokale Demo-Anmeldung für die Schulpräsentation. Deine Daten bleiben nur in diesem Browser gespeichert.</div>' +
      '</div>';
  }

  function render() {
    if (!auth.currentUser) {
      document.getElementById("root").innerHTML = renderAuthScreen();
      return;
    }

    var body;
    if (ui.tab === "calendar") body = renderCalendar();
    else if (ui.tab === "feed") body = renderFeed();
    else if (ui.tab === "friends") body = renderFriends();
    else if (ui.tab === "stats") body = renderStats();
    else body = renderHome();

    function navBtn(tab, iconName) {
      var active = ui.tab === tab;
      return '<button onclick="setTab(\'' + tab + '\')" style="background:none;border:none;cursor:pointer;color:' + (active ? GREEN : TEXT_MUTED) + ';padding:6px;">' + icon(iconName, { size: 20 }) + '</button>';
    }

    var overlay = "";
    if (ui.focusTimer) {
      var remainingMs = Math.max(0, ui.focusTimer.endsAt - Date.now());
      var mm = Math.floor(remainingMs / 60000);
      var ss = Math.floor((remainingMs % 60000) / 1000);
      overlay = '' +
        '<div style="position:absolute;inset:0;background:' + GREEN + ';color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;border-radius:24px;">' +
          icon("clock", { size: 40, color: "#fff" }) +
          '<div style="font-size:36px;font-weight:700;margin-top:16px;letter-spacing:1px;">' + pad(mm) + ':' + pad(ss) + '</div>' +
          '<div style="font-size:13px;opacity:0.9;margin-top:6px;">Fokus-Modus aktiv – Handy weglegen</div>' +
          '<button onclick="cancelFocusTimer()" style="margin-top:24px;background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.5);color:#fff;border-radius:10px;padding:8px 16px;font-size:12px;cursor:pointer;">Abbrechen</button>' +
        '</div>';
    } else if (ui.adVideo) {
      var secLeft = Math.max(0, ui.adVideo.secondsLeft);
      overlay = '' +
        '<div style="position:absolute;inset:0;background:#111;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;border-radius:24px;">' +
          '<div style="position:absolute;top:14px;left:16px;font-size:10px;letter-spacing:0.5px;opacity:0.6;text-transform:uppercase;">Werbung</div>' +
          '<div style="width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,' + GREEN + ',' + GREEN_DARK + ');display:flex;align-items:center;justify-content:center;">' + icon("play", { size: 40, color: "#fff" }) + '</div>' +
          '<div style="font-size:15px;font-weight:600;margin-top:18px;">' + esc(ui.adVideo.partner.name) + '</div>' +
          '<div style="font-size:12px;opacity:0.7;margin-top:4px;">' + esc(ui.adVideo.partner.tag) + '</div>' +
          (secLeft > 0
            ? '<div style="font-size:12px;opacity:0.6;margin-top:22px;">Video endet in ' + secLeft + 's</div>'
            : '<button onclick="closeAdVideo()" style="margin-top:22px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.4);color:#fff;border-radius:10px;padding:8px 16px;font-size:12px;cursor:pointer;">Schließen</button>') +
        '</div>';
    }

    var html = '' +
      '<div class="card">' +
        overlay +
        renderTopHeader() +
        renderSubBanner() +
        '<div style="flex:1;padding:18px 18px 90px;overflow-y:auto;">' +
          renderSubscribeModal() +
          body +
        '</div>' +
        '<div style="position:sticky;bottom:0;background:#fff;border-top:1px solid ' + CARD_BORDER + ';display:flex;justify-content:space-around;padding:10px 0 14px;">' +
          navBtn("home", "home") + navBtn("calendar", "calendar") + navBtn("feed", "message") + navBtn("friends", "users") + navBtn("stats", "bar") +
        '</div>' +
      '</div>';

    document.getElementById("root").innerHTML = html;
  }

  if (auth.currentUser) startBackgroundTimers();
  render();
})();
</script>
</body>
</html>
